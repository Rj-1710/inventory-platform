name: Build and Test

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v7

      - name: Require project version change
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git show "origin/${BASE_REF}:pom.xml" > /tmp/base-pom.xml

          BASE_VERSION=$(mvn -q -f /tmp/base-pom.xml help:evaluate -Dexpression=project.version -DforceStdout)
          CURRENT_VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)

          echo "Base version: $BASE_VERSION"
          echo "PR version: $CURRENT_VERSION"

          if [ "$BASE_VERSION" = "$CURRENT_VERSION" ]; then
            echo "Error: Update the project version in pom.xml before merging."
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode verify